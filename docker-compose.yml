services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quovadis
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/quovadis
    depends_on: [db]
volumes:
  postgres_data:
