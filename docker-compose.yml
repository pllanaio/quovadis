services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quovadis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quovadis"]
      interval: 5s
      retries: 10
  app:
    build: .
    ports: ["127.0.0.1:3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/quovadis
      SETTINGS_KEY_FILE: /app/data/settings.key
      WORKER_KEY_FILE: /app/data/worker.key
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["node", "scripts/worker.mjs"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/quovadis
      SETTINGS_KEY_FILE: /app/data/settings.key
      WORKER_KEY_FILE: /app/data/worker.key
    volumes:
      - app_data:/app/data
    depends_on:
      - app
    restart: unless-stopped
volumes:
  postgres_data:
  app_data:
