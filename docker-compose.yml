services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quovadis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quovadis"]
      interval: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/quovadis
      SETTINGS_KEY_FILE: /app/data/settings.key
      WORKER_KEY_FILE: /app/data/worker.key
      NODE_USE_ENV_PROXY: "1"
      NO_PROXY: searxng,app,db,localhost,127.0.0.1,::1
      no_proxy: searxng,app,db,localhost,127.0.0.1,::1
    volumes:
      - app_data:/app/data
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_healthy
  searxng:
    image: searxng/searxng@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'export SEARXNG_SECRET="$$(head -c 32 /dev/urandom | base64)"; exec /usr/local/searxng/entrypoint.sh'
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "-T", "5", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "scripts/worker.mjs"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/quovadis
      SETTINGS_KEY_FILE: /app/data/settings.key
      WORKER_KEY_FILE: /app/data/worker.key
      NODE_USE_ENV_PROXY: "1"
      NO_PROXY: searxng,app,db,localhost,127.0.0.1,::1
      no_proxy: searxng,app,db,localhost,127.0.0.1,::1
    volumes:
      - app_data:/app/data
    depends_on:
      - app
    restart: unless-stopped
volumes:
  postgres_data:
  app_data:
